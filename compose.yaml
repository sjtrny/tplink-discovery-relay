services:
  tplink-discovery-relay:
    image: ghcr.io/sjtrny/tplink-discovery-relay:latest
    network_mode: host

    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]

    restart: unless-stopped

    environment:
      LAN_IF: ${LAN_IF:?Set LAN_IF in .env}
      LAN_NET: ${LAN_NET:?Set LAN_NET in .env}
      DOCKER_SUBNET: ${DOCKER_SUBNET:?Set DOCKER_SUBNET in .env}
      HA_IP: ${HA_IP:?Set HA_IP in .env}
      HA_PORT: ${HA_PORT:-8123}
      RELAY_DEBUG: ${RELAY_DEBUG:-false}

    volumes:
      - type: bind
        source: /run/xtables.lock
        target: /run/xtables.lock
        bind:
          create_host_path: false

    read_only: true

    tmpfs:
      - /run:rw,exec,nosuid,nodev,mode=755,size=16m

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s
